  <defs><style>.t{font:700 44px Arial;fill:#0f172a}.h{font:700 29px Arial;fill:#0f172a}.p{font:22px Arial;fill:#334155}.ok{fill:#ecfdf5;stroke:#16a34a;stroke-width:4;rx:22}.bad{fill:#fef2f2;stroke:#dc2626;stroke-width:4;rx:22}</style></defs>
