<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>.t{font:700 46px Arial;fill:#0f172a}.h{font:700 28px Arial;fill:#0f172a}.p{font:22px Arial;fill:#334155}.l{stroke:#475569;stroke-width:5;marker-end:url(#a)}.b{stroke-width:3;rx:24}</style></defs>
  <rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="90" text-anchor="middle" class="t">StandardScaler + MLP 28–32–16–5</text>
  <g transform="translate(70 260)">
    <rect class="b" width="250" height="280" fill="#fef3c7" stroke="#d97706"/><text x="125" y="80" text-anchor="middle" class="h">28 features</text><text x="125" y="135" text-anchor="middle" class="p">X · Y · Z · |a|</text><text x="125" y="195" text-anchor="middle" class="p">7 statistikmål</text>
    <line x1="250" y1="140" x2="355" y2="140" class="l"/>
    <rect x="370" class="b" width="250" height="280" fill="#dcfce7" stroke="#16a34a"/><text x="495" y="75" text-anchor="middle" class="h">StandardScaler</text><text x="495" y="135" text-anchor="middle" class="p">z = (x − μ) / σ</text><text x="495" y="195" text-anchor="middle" class="p">μ og σ fra train</text>
    <line x1="620" y1="140" x2="725" y2="140" class="l"/>
    <rect x="740" class="b" width="220" height="280" fill="#dbeafe" stroke="#2563eb"/><text x="850" y="80" text-anchor="middle" class="h">32 neuroner</text><text x="850" y="140" text-anchor="middle" class="p">vægt + bias</text><text x="850" y="195" text-anchor="middle" class="p">ReLU</text>
    <line x1="960" y1="140" x2="1040" y2="140" class="l"/>
    <rect x="1055" class="b" width="220" height="280" fill="#ede9fe" stroke="#7c3aed"/><text x="1165" y="80" text-anchor="middle" class="h">16 neuroner</text><text x="1165" y="140" text-anchor="middle" class="p">vægt + bias</text><text x="1165" y="195" text-anchor="middle" class="p">ReLU</text>
    <line x1="1275" y1="140" x2="1355" y2="140" class="l"/>
    <rect x="1370" y="15" class="b" width="160" height="250" fill="#fee2e2" stroke="#dc2626"/><text x="1450" y="80" text-anchor="middle" class="h">5 output</text><text x="1450" y="140" text-anchor="middle" class="p">logits</text><text x="1450" y="195" text-anchor="middle" class="p">softmax</text>
  </g>
  <text x="800" y="680" text-anchor="middle" class="h">Træning: vægte og biases justeres med backpropagation</text>
  <text x="800" y="730" text-anchor="middle" class="p">Inference på Photon 2: kun forward-pass med de lærte parametre</text>
</svg>
