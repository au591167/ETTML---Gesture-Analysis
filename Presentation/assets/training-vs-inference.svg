<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>.t{font:700 44px Arial;fill:#0f172a}.h{font:700 29px Arial;fill:#0f172a}.p{font:22px Arial;fill:#334155}.card{stroke-width:4;rx:24}.l{stroke:#334155;stroke-width:5;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="70" text-anchor="middle" class="t">Træning lærer parametre · inference bruger dem</text>
  <rect x="55" y="120" width="720" height="650" fill="#eff6ff" stroke="#2563eb" class="card"/><text x="415" y="175" text-anchor="middle" class="h">PC · Python · træning</text>
  <rect x="145" y="235" width="210" height="105" fill="#fff" stroke="#2563eb" class="card"/><text x="250" y="298" text-anchor="middle" class="p">train-data + labels</text><line x1="355" y1="288" x2="455" y2="288" class="l"/><rect x="470" y="235" width="210" height="105" fill="#fff" stroke="#2563eb" class="card"/><text x="575" y="280" text-anchor="middle" class="p">forward-pass</text><text x="575" y="315" text-anchor="middle" class="p">+ loss</text>
  <line x1="575" y1="340" x2="575" y2="420" class="l"/><rect x="470" y="435" width="210" height="105" fill="#fff" stroke="#2563eb" class="card"/><text x="575" y="480" text-anchor="middle" class="p">backpropagation</text><text x="575" y="515" text-anchor="middle" class="p">+ optimizer</text><path d="M470 488 C380 488 380 288 455 288" fill="none" class="l"/>
  <text x="415" y="625" text-anchor="middle" class="h">Resultat</text><text x="415" y="670" text-anchor="middle" class="p">μ, σ, vægte og biases</text><text x="415" y="710" text-anchor="middle" class="p">læres og eksporteres</text>
  <rect x="825" y="120" width="720" height="650" fill="#f0fdf4" stroke="#16a34a" class="card"/><text x="1185" y="175" text-anchor="middle" class="h">Photon 2 · C++ · inference</text>
  <rect x="900" y="250" width="210" height="115" fill="#fff" stroke="#16a34a" class="card"/><text x="1005" y="298" text-anchor="middle" class="p">nyt sensorvindue</text><text x="1005" y="332" text-anchor="middle" class="p">28 features</text><line x1="1110" y1="308" x2="1205" y2="308" class="l"/><rect x="1220" y="250" width="235" height="115" fill="#fff" stroke="#16a34a" class="card"/><text x="1338" y="298" text-anchor="middle" class="p">scaler +</text><text x="1338" y="332" text-anchor="middle" class="p">forward-pass</text>
