<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>.t{font:700 44px Arial;fill:#0f172a}.h{font:700 27px Arial;fill:#0f172a}.p{font:21px Arial;fill:#334155}.b{stroke-width:3;rx:20}.l{stroke:#334155;stroke-width:5;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="80" text-anchor="middle" class="t">Samme modelkontrakt – stabil handling</text>
  <text x="350" y="155" text-anchor="middle" class="h">Python: træning og eksport</text><text x="1200" y="155" text-anchor="middle" class="h">Photon 2: inference og beslutning</text>
  <g transform="translate(60 220)">
    <rect class="b" width="230" height="150" fill="#dbeafe" stroke="#2563eb"/><text x="115" y="62" text-anchor="middle" class="h">CSV-data</text><text x="115" y="105" text-anchor="middle" class="p">labels + features</text>
    <line x1="230" y1="75" x2="310" y2="75" class="l"/>
    <rect x="325" class="b" width="260" height="150" fill="#dcfce7" stroke="#16a34a"/><text x="455" y="58" text-anchor="middle" class="h">Fit scaler + MLP</text><text x="455" y="105" text-anchor="middle" class="p">lær μ, σ, W og b</text>
    <line x1="585" y1="75" x2="665" y2="75" class="l"/>
    <rect x="680" class="b" width="250" height="150" fill="#fef3c7" stroke="#d97706"/><text x="805" y="58" text-anchor="middle" class="h">C++ arrays</text><text x="805" y="105" text-anchor="middle" class="p">fast featureorden</text>
    <line x1="930" y1="75" x2="1010" y2="75" class="l"/>
    <rect x="1025" class="b" width="250" height="150" fill="#ede9fe" stroke="#7c3aed"/><text x="1150" y="58" text-anchor="middle" class="h">Forward-pass</text><text x="1150" y="105" text-anchor="middle" class="p">5 softmax-scores</text>
    <line x1="1275" y1="75" x2="1355" y2="75" class="l"/>
    <rect x="1370" class="b" width="170" height="150" fill="#fee2e2" stroke="#dc2626"/><text x="1455" y="58" text-anchor="middle" class="h">Kandidat</text><text x="1455" y="105" text-anchor="middle" class="p">klasse + score</text>
  </g>
  <g transform="translate(150 505)">
    <rect class="b" width="250" height="140" fill="#fff7ed" stroke="#ea580c"/><text x="125" y="58" text-anchor="middle" class="h">score ≥ 0,75</text><text x="125" y="100" text-anchor="middle" class="p">afvis usikker</text>
    <line x1="250" y1="70" x2="345" y2="70" class="l"/>
    <rect x="360" class="b" width="250" height="140" fill="#fff7ed" stroke="#ea580c"/><text x="485" y="58" text-anchor="middle" class="h">3 ens i træk</text><text x="485" y="100" text-anchor="middle" class="p">stabil prediction</text>
    <line x1="610" y1="70" x2="705" y2="70" class="l"/>
    <rect x="720" class="b" width="250" height="140" fill="#fff7ed" stroke="#ea580c"/><text x="845" y="58" text-anchor="middle" class="h">Tap-kontrol</text><text x="845" y="100" text-anchor="middle" class="p">impact count</text>
    <line x1="970" y1="70" x2="1065" y2="70" class="l"/>
    <rect x="1080" class="b" width="250" height="140" fill="#fff7ed" stroke="#ea580c"/><text x="1205" y="58" text-anchor="middle" class="h">4 s debounce</text><text x="1205" y="100" text-anchor="middle" class="p">undgå dublet</text>
  </g>
  <line x1="800" y1="660" x2="800" y2="735" class="l"/><rect x="610" y="750" class="b" width="380" height="105" fill="#dcfce7" stroke="#16a34a"/><text x="800" y="795" text-anchor="middle" class="h">EVENT + RGB-feedback</text><text x="800" y="830" text-anchor="middle" class="p">kun efter godkendt handling</text>
