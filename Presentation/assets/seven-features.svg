<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><style>.t{font:700 44px Arial;fill:#0f172a}.h{font:700 27px Arial;fill:#0f172a}.f{font:25px Cambria Math,serif;fill:#1e293b}.p{font:20px Arial;fill:#475569}.c{stroke-width:3;rx:18}</style></defs>
  <rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="70" text-anchor="middle" class="t">De syv features for hver signal-kanal</text>
  <g transform="translate(55 125)">
    <rect width="350" height="260" fill="#dbeafe" stroke="#2563eb" class="c"/><text x="175" y="55" text-anchor="middle" class="h">Standardafvigelse</text><text x="175" y="115" text-anchor="middle" class="f">σ = √mean((x−μ)²)</text><text x="175" y="175" text-anchor="middle" class="p">typisk variation omkring</text><text x="175" y="205" text-anchor="middle" class="p">signalets gennemsnit</text>
    <rect x="380" width="350" height="260" fill="#dcfce7" stroke="#16a34a" class="c"/><text x="555" y="55" text-anchor="middle" class="h">Minimum</text><text x="555" y="115" text-anchor="middle" class="f">min(x)</text><text x="555" y="175" text-anchor="middle" class="p">største negative</text><text x="555" y="205" text-anchor="middle" class="p">udsving</text>
    <rect x="760" width="350" height="260" fill="#fef3c7" stroke="#d97706" class="c"/><text x="935" y="55" text-anchor="middle" class="h">Maksimum</text><text x="935" y="115" text-anchor="middle" class="f">max(x)</text><text x="935" y="175" text-anchor="middle" class="p">største positive</text><text x="935" y="205" text-anchor="middle" class="p">udsving</text>
    <rect x="1140" width="350" height="260" fill="#ede9fe" stroke="#7c3aed" class="c"/><text x="1315" y="55" text-anchor="middle" class="h">Range</text><text x="1315" y="115" text-anchor="middle" class="f">max(x) − min(x)</text><text x="1315" y="175" text-anchor="middle" class="p">signalets samlede</text><text x="1315" y="205" text-anchor="middle" class="p">spænd</text>
    <rect x="190" y="310" width="350" height="260" fill="#fee2e2" stroke="#dc2626" class="c"/><text x="365" y="365" text-anchor="middle" class="h">Energi</text><text x="365" y="425" text-anchor="middle" class="f">mean(x²)</text><text x="365" y="485" text-anchor="middle" class="p">gennemsnitlig kvadreret</text><text x="365" y="515" text-anchor="middle" class="p">signalstyrke</text>
    <rect x="570" y="310" width="350" height="260" fill="#ffedd5" stroke="#ea580c" class="c"/><text x="745" y="365" text-anchor="middle" class="h">Peak count</text><text x="745" y="425" text-anchor="middle" class="f">lokale toppe ≥ 0,05 g</text><text x="745" y="485" text-anchor="middle" class="p">impulser med mindst</text><text x="745" y="515" text-anchor="middle" class="p">8 samples afstand</text>
    <rect x="950" y="310" width="430" height="260" fill="#cffafe" stroke="#0891b2" class="c"/><text x="1165" y="365" text-anchor="middle" class="h">Maximum absolute difference</text><text x="1165" y="425" text-anchor="middle" class="f">max(|xᵢ − xᵢ₋₁|)</text><text x="1165" y="485" text-anchor="middle" class="p">største ændring mellem</text><text x="1165" y="515" text-anchor="middle" class="p">to nabo-samples</text>
  </g>
  <text x="800" y="790" text-anchor="middle" class="h">X, Y, Z og magnitude × 7 = 28 features</text><text x="800" y="835" text-anchor="middle" class="p">Alle features beregnes efter mean removal i både Python og C++</text>
</svg>
