<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>.t{font:700 44px Arial;fill:#0f172a}.h{font:700 27px Arial;fill:#0f172a}.p{font:21px Arial;fill:#334155}.card{stroke-width:3;rx:20}.l{stroke:#334155;stroke-width:5;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="70" text-anchor="middle" class="t">Den rigtige kilde afhænger af påstanden</text>
  <g transform="translate(70 150)">
    <rect width="270" height="470" fill="#ede9fe" stroke="#7c3aed" class="card"/><text x="135" y="65" text-anchor="middle" class="h">Kursusbrief</text><text x="135" y="145" text-anchor="middle" class="p">krav</text><text x="135" y="185" text-anchor="middle" class="p">eksamensform</text><text x="135" y="225" text-anchor="middle" class="p">scope</text><text x="135" y="350" text-anchor="middle" class="h">[1]–[2]</text><text x="135" y="405" text-anchor="middle" class="p">lokal autoritet</text>
    <line x1="270" y1="235" x2="325" y2="235" class="l"/>
    <rect x="340" width="270" height="470" fill="#fee2e2" stroke="#dc2626" class="card"/><text x="475" y="65" text-anchor="middle" class="h">Producent</text><text x="475" y="145" text-anchor="middle" class="p">sensorområde</text><text x="475" y="185" text-anchor="middle" class="p">processor</text><text x="475" y="225" text-anchor="middle" class="p">RAM og flash</text><text x="475" y="350" text-anchor="middle" class="h">[3]–[4]</text><text x="475" y="405" text-anchor="middle" class="p">primær teknisk kilde</text>
    <line x1="610" y1="235" x2="665" y2="235" class="l"/>
    <rect x="680" width="270" height="470" fill="#dbeafe" stroke="#2563eb" class="card"/><text x="815" y="65" text-anchor="middle" class="h">Officiel API</text><text x="815" y="145" text-anchor="middle" class="p">StandardScaler</text><text x="815" y="185" text-anchor="middle" class="p">MLPClassifier</text><text x="815" y="225" text-anchor="middle" class="p">konkret adfærd</text><text x="815" y="350" text-anchor="middle" class="h">[5]–[6]</text><text x="815" y="405" text-anchor="middle" class="p">implementeringskontrakt</text>
    <line x1="950" y1="235" x2="1005" y2="235" class="l"/>
    <rect x="1020" width="270" height="470" fill="#fef3c7" stroke="#d97706" class="card"/><text x="1155" y="65" text-anchor="middle" class="h">Lærebøger</text><text x="1155" y="145" text-anchor="middle" class="p">generel teori</text><text x="1155" y="185" text-anchor="middle" class="p">matematik</text><text x="1155" y="225" text-anchor="middle" class="p">metodevalg</text><text x="1155" y="350" text-anchor="middle" class="h">[7]–[9]</text><text x="1155" y="405" text-anchor="middle" class="p">baggrundslitteratur</text>
    <line x1="1290" y1="235" x2="1345" y2="235" class="l"/>
    <rect x="1360" width="170" height="470" fill="#dcfce7" stroke="#16a34a" class="card"/><text x="1445" y="65" text-anchor="middle" class="h">Egen</text><text x="1445" y="100" text-anchor="middle" class="h">evidens</text><text x="1445" y="165" text-anchor="middle" class="p">data</text><text x="1445" y="205" text-anchor="middle" class="p">kode</text><text x="1445" y="245" text-anchor="middle" class="p">logs</text><text x="1445" y="285" text-anchor="middle" class="p">måling</text><text x="1445" y="385" text-anchor="middle" class="p">projektets</text><text x="1445" y="420" text-anchor="middle" class="p">resultater</text>
  </g>
  <text x="800" y="720" text-anchor="middle" class="h">En kilde er stærk til bestemte påstande – ikke til alt</text><text x="800" y="770" text-anchor="middle" class="p">Et datablad forklarer sensoren · en bog forklarer teorien · egne målinger viser prototypens resultat</text>
  <text x="800" y="830" text-anchor="middle" class="p">[7]–[9] står som baggrundslitteratur i bibliografien, men er ikke knyttet til bestemte sætninger i rapportteksten</text>
</svg>
